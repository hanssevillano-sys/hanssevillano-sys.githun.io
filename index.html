<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Hanss Sevillano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">HS</div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#results">Results</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Cover Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <img src="1.png" alt="Cover" class="hero-image">
        </div>
    </section>

    <!-- About Me Section -->
    <section id="about" class="about">
        <div class="container">
            <img src="2.png" alt="About Me" class="section-image">
        </div>
    </section>

    <!-- Services Section -->
    <section id="services" class="services">
        <div class="container">
            <img src="3.png" alt="Services" class="section-image">
        </div>
    </section>

    <!-- Results Section -->
    <section id="results" class="results">
        <div class="container">
            <img src="4.png" alt="Results" class="section-image">
        </div>
    </section>

    <!-- Experience Section -->
    <section id="experience" class="experience">
        <div class="container">
            <h2>Experience</h2>
            
            <div class="experience-item">
                <img src="5.png" alt="JNB Exectant" class="experience-image">
            </div>

            <div class="experience-item">
                <img src="6.png" alt="Ysa Marissa Torres" class="experience-image">
            </div>

            <div class="experience-item">
                <img src="7.png" alt="Gillens Sizzlers" class="experience-image">
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="container">
            <img src="8.png" alt="Contact" class="contact-image">
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Hanss Sevillano. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
